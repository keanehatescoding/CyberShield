name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel older runs on the same branch/PR when new commits land
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Dependabot-authored pull_request runs get NO repository secrets from GitHub
      # (by design, so a malicious dependency bump can't exfiltrate them) — so
      # GOOGLE_SERVICES_JSON is empty on those runs. Fall back to a placeholder file
      # so lint/test/assembleDebug can still run; they never make real Firebase calls.
      # Either way, validate the JSON so a bad secret fails fast with a clear message
      # instead of a confusing Gradle stacktrace three tasks later.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not available for this run (likely a Dependabot PR) — writing a placeholder google-services.json so the build can proceed."
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "cybershield-ci-placeholder",
              "storage_bucket": "cybershield-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.example.cybershield" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDUMMY-CI-PLACEHOLDER-KEY-0000000" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          python3 -c "import json; json.load(open('app/google-services.json'))"

      # Debug builds never read the release signingConfig (app/build.gradle.kts only
      # wires KEYSTORE_PATH/KEY_ALIAS/etc. into the `release` build type), so lint,
      # unit tests, and assembleDebug need nothing beyond sdk.dir here. Keystore
      # decoding and signing secrets belong in release.yml only — see that workflow.
      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Ktlint check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Enforce coverage floor
        run: ./gradlew jacocoTestCoverageVerification --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/ktlint/
          retention-days: 14
